<!doctype html>
<meta charset="utf-8">
<title>Verb-Subject Colorizer — minimal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:20px;background:#fafafa}
  textarea{width:100%;min-height:140px;padding:10px;border:1px solid #ccc;border-radius:8px;resize:vertical}
  .row{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
  .box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
  #out{min-height:100px;line-height:1.7;font-size:18px}
  .yo{color:red}.tu{color:blue}.el{color:goldenrod}.nos{color:purple}.ellos{color:green}.shared{color:orange}
  noscript{color:#b00020;font-weight:700}
</style>

<h1>Verb-Subject Colorizer (minimal)</h1>
<noscript>JavaScript is disabled — enable it to use this page.</noscript>

<div class="box">
  <div class="row">
    <button onclick="alert('JS works ✅');">Test JS</button>
    <button onclick="run()">Colorize</button>
    <button onclick="downloadHTML()">Download HTML</button>
  </div>
  <textarea id="in">Yo hablo. Tú hablas. Ella habla. Nosotros hablamos. Ustedes hablan.
Voy a hablar; estoy hablando.
He comido; Has vivido; Ha hablado; Hemos pensado; Han dormido.
Ayer hablé, hablaste, habló, hablamos, hablaron. Antes, hablaba y comía; tú vivías; nosotros vivíamos; ellos vivían.
El camino es largo, pero yo camino rápido.</textarea>
</div>

<div class="box" style="margin-top:12px">
  <div><b>Preview:</b></div>
  <div id="out"></div>
</div>

<script>
  // --- tiny helpers (no modern regex) ---
  function esc(s){return s.replace(/[&<>"]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));}
  function isLetter(ch){return ch.toLowerCase()!==ch.toUpperCase();}
  function isWord(tok){if(!tok) return false; for(let i=0;i<tok.length;i++) if(!isLetter(tok[i])) return false; return true;}

  // tokenization that keeps spaces/punct
  function tokenize(s){
    const out=[], n=s.length; let cur='';
    for(let i=0;i<n;i++){
      const ch=s[i];
      if(isLetter(ch)) cur+=ch; else { if(cur){out.push(cur);cur='';} out.push(ch); }
    }
    if(cur) out.push(cur);
    return out;
  }

  // extremely small “verb gate”
  const DET = new Set(["el","la","los","las","lo","un","una","unos","unas","al","del","mi","mis","tu","tus","su","sus"]);
  const ESTAR = new Set(["estoy","estas","estás","esta","está","estamos","estan","están"]);
  const IR = new Set(["voy","vas","va","vamos","van"]);
  const HABER = new Set(["he","has","ha","hemos","han"]);

  function looksLikeVerb(tokens,i){
    const t=tokens[i].toLowerCase();
    if(ESTAR.has(t)||IR.has(t)||HABER.has(t)) return true;
    if(i>0 && DET.has(tokens[i-1].toLowerCase())) return false;
    const ends = ["o","as","a","amos","an","es","e","emos","en","imos","é","aste","ó","amos","aron","í","iste","ió","imos","ieron","aba","abas","aban","ía","ías","ían"];
    for(const e of ends){ if(t.endsWith(e) && isWord(tokens[i])) return true; }
    return false;
  }

  // color only the person marker (Paco rules) — simplified but correct for your use cases
  function colorToken(tok){
    const low=tok.toLowerCase();

    // present perfect: color only after silent h
    if(HABER.has(low)){
      const map={he:["yo","e"],has:["tu","as"],ha:["el","a"],hemos:["nos","emos"],han:["ellos","an"]};
      const m=map[low]; if(m){const part=m[1],who=m[0]; const idx=low.lastIndexOf(part);
        return esc(tok.slice(0,idx)) + `<span class="${who}">`+esc(tok.slice(idx))+'</span>'; }

    }

    // estar + gerund: estoy -> only 'oy'; demás persona normal
    if(ESTAR.has(low)){
      if(low==="estoy"){const idx=tok.toLowerCase().lastIndexOf("oy"); return esc(tok.slice(0,idx))+`<span class="yo">`+esc(tok.slice(idx))+'</span>';}
      if(low.endsWith("ás")) return esc(tok.slice(0,-1))+`<span class="tu">`+esc(tok.slice(-1))+'</span>';
      if(low.endsWith("á"))  return esc(tok.slice(0,-1))+`<span class="el">`+esc(tok.slice(-1))+'</span>';
      if(low.endsWith("amos"))return esc(tok.slice(0,-4))+`<span class="nos">`+esc(tok.slice(-4))+'</span>';
      if(low.endsWith("án")) return esc(tok.slice(0,-1))+`<span class="ellos">`+esc(tok.slice(-1))+'</span>';
    }

    // ir a: voy -> only 'oy'; demás persona normal
    if(IR.has(low)){
      if(low==="voy"){const idx=tok.toLowerCase().lastIndexOf("oy"); return esc(tok.slice(0,idx))+`<span class="yo">`+esc(tok.slice(idx))+'</span>';}
      if(low.endsWith("s")) return esc(tok.slice(0,-1))+`<span class="tu">`+esc(tok.slice(-1))+'</span>';
      if(low.endsWith("a")) return esc(tok.slice(0,-1))+`<span class="el">`+esc(tok.slice(-1))+'</span>';
      if(low.endsWith("mos")) return esc(tok.slice(0,-3))+`<span class="nos">`+esc(tok.slice(-3))+'</span>';
      if(low.endsWith("n")) return esc(tok.slice(0,-1))+`<span class="ellos">`+esc(tok.slice(-1))+'</span>';
    }

    // imperfect shared yo=3rd → orange
    if(low.endsWith("ábamos")||low.endsWith("íamos")) return esc(tok.slice(0,-4))+`<span class="nos">`+esc(tok.slice(-4))+'</span>';
    if(low.endsWith("aban")||low.endsWith("ían"))     return esc(tok.slice(0,-2))+`<span class="ellos">`+esc(tok.slice(-2))+'</span>';
    if(low.endsWith("abas")||low.endsWith("ías"))     return esc(tok.slice(0,-2))+`<span class="tu">`+esc(tok.slice(-2))+'</span>';
    if(low.endsWith("aba"))                           return esc(tok.slice(0,-3))+`<span class="shared">`+esc(tok.slice(-3))+'</span>';
    if(low.endsWith("ía"))                            return esc(tok.slice(0,-2))+`<span class="shared">`+esc(tok.slice(-2))+'</span>';

    // preterite regular
    if(low.endsWith("é"))                             return esc(tok.slice(0,-1))+`<span class="yo">`+esc(tok.slice(-1))+'</span>';
    if(low.endsWith("aste")||low.endsWith("iste"))    return esc(tok.slice(0,-4))+`<span class="tu">`+esc(tok.slice(-4))+'</span>';
    if(low.endsWith("ó"))                             return esc(tok.slice(0,-1))+`<span class="el">`+esc(tok.slice(-1))+'</span>';
    if(low.endsWith("amos")||low.endsWith("imos"))    return esc(tok.slice(0,-4))+`<span class="nos">`+esc(tok.slice(-4))+'</span>';
    if(low.endsWith("aron")||low.endsWith("ieron"))   return esc(tok.slice(0,-3))+`<span class="ellos">`+esc(tok.slice(-3))+'</span>';

    // present default
    if(low.endsWith("amos")||low.endsWith("emos")||low.endsWith("imos")) return esc(tok.slice(0,-4))+`<span class="nos">`+esc(tok.slice(-4))+'</span>';
    if(low.endsWith("an")||low.endsWith("en"))        return esc(tok.slice(0,-1))+`<span class="ellos">`+esc(tok.slice(-1))+'</span>';
    if(low.endsWith("as")||low.endsWith("es"))        return esc(tok.slice(0,-1))+`<span class="tu">`+esc(tok.slice(-1))+'</span>';
    if(low.endsWith("a")||low.endsWith("e"))          return esc(tok.slice(0,-1))+`<span class="el">`+esc(tok.slice(-1))+'</span>';
    if(low.endsWith("o"))                             return esc(tok.slice(0,-1))+`<span class="yo">`+esc(tok.slice(-1))+'</span>';

    return esc(tok);
  }

  function colorize(s){
    const tks=tokenize(s), out=[];
    for(let i=0;i<tks.length;i++){
      const t=tks[i];
      if(isWord(t) && looksLikeVerb(tks,i)) out.push(colorToken(t));
      else out.push(esc(t));
    }
    return out.join('');
  }

  function run(){
    const src=document.getElementById('in').value;
    document.getElementById('out').innerHTML = colorize(src);
  }

  function downloadHTML(){
    const html='<!doctype html><meta charset="utf-8"><div style="font-family:serif;font-size:18px;line-height:1.7">'+
      document.getElementById('out').innerHTML+'</div>';
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='colorized.html'; a.click();
    URL.revokeObjectURL(a.href);
  }

  // initial preview
  run();
</script>
